name: Scraper Mercado Livre

on:
  schedule:
    # 06:00 em America/Sao_Paulo (runner usa UTC, UTC-3).
    #
    # Uma vez por dia, nao duas. Isto aqui e trafego automatizado contra site
    # de terceiro, e o Mercado Livre bloqueia IP quando quer — metade das
    # requisicoes e metade do risco. Para o que o projeto precisa mostrar,
    # ter produto na tela, a diferenca entre 12h e 24h de defasagem e nenhuma.
    - cron: "0 9 * * *"
  workflow_dispatch:

# Substitui o flock do run_scrapping.sh: duas execucoes nunca se cruzam.
concurrency:
  group: promoly-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Equivalente ao arquivo .pipeline_disabled: commitar esse arquivo
      # na raiz desliga o pipeline sem mexer no workflow.
      - name: Verifica flag de desligamento
        id: flag
        run: |
          if [ -f .pipeline_disabled ]; then
            echo "Pipeline desativado por .pipeline_disabled"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.flag.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependencias
        if: steps.flag.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Roda scraper
        if: steps.flag.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Sao dois hosts diferentes: o catalogo fica em www e a busca em
          # lista. Faltando URL_MLB_SEARCH_BASE, o url_builder levanta
          # RuntimeError na primeira query.
          URL_MLB_BASE: ${{ vars.URL_MLB_BASE }}
          URL_MLB_SEARCH_BASE: ${{ vars.URL_MLB_SEARCH_BASE }}

          SCRAPER_ENABLED_CATEGORIES: ${{ vars.SCRAPER_ENABLED_CATEGORIES }}

          # Opcionais: o codigo tem default para as duas. Passam mesmo assim
          # para que a configuracao efetiva fique visivel no log do run, em vez
          # de escondida no fonte.
          ML_PAGE_SIZE: ${{ vars.ML_PAGE_SIZE }}
          SCRAPER_DEBUG_HTML: ${{ vars.SCRAPER_DEBUG_HTML }}
        run: python -m scrapper_mlb.main
